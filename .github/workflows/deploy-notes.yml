# 通过 GitHub Actions 构建 VitePress 并部署到 GitHub Pages。
# 首次使用：仓库 Settings → Pages → Build and deployment → Source 选择「GitHub Actions」
# （若仍选「Deploy from a branch」，本工作流不会作为发布源生效。）
#
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'notes/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-notes.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build VitePress
        run: pnpm run docs:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: notes/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
